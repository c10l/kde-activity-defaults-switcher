name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    name: Build, test, and lint (Debian)
    runs-on: ubuntu-latest
    container: debian:forky
    steps:
      # Minimal bootstrap: git needs a CA bundle to do an https checkout; the
      # full build/toolchain dependency set is installed by `make deps` below,
      # so it stays in a single place (scripts/setup-deps.sh).
      - name: Install make, git and CA certificates (for checkout)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            make

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and toolchain dependencies
        run: make deps

      # The same make tasks an engineer runs locally.
      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint (format check + clang-tidy)
        run: make lint

      - name: Format check
        run: make format-check
